services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      API_TOKEN: ${AGENTOPS_API_TOKEN:?Set AGENTOPS_API_TOKEN in the terminal before starting Compose}
      DATABASE_URL: sqlite:////app/backend/data/agentops.db
    volumes:
      - agentops-data:/app/backend/data
    ports:
      - '127.0.0.1:8000:8000'
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      API_TOKEN: ${AGENTOPS_API_TOKEN}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
volumes:
  agentops-data:
